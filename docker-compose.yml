services:
  apuspay:
    build: .
    image: apuspay:local
    container_name: apuspay
    restart: unless-stopped
    ports:
      - "${LISTEN_IP:-127.0.0.1}:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      ALLOW_PRIVATE_CALLBACKS: ${ALLOW_PRIVATE_CALLBACKS:-false}
      ALLOWED_CALLBACK_HOSTS: ${ALLOWED_CALLBACK_HOSTS:-}
    volumes:
      - ./data:/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - apuspay-net

networks:
  apuspay-net:
    driver: bridge
